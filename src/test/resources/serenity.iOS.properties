
serenity.project.name=QT Automation Serenity with Cucumber
serenity.requirements.dir=src/test/resources/features
# How long does Serenity wait for elements that are not present on the screen to load
webdriver.timeouts.implicitlywait=5000
webdriver.wait.for.timeout=5000
serenity.timeout=5000
serenity.take.screenshots=AFTER_EACH_STEP
untrusted.certificates=true



webdriver.driver=appium
serenity.driver.capabilities="appiumVersion:1.6.5;deviceOrientation:portrait"
appium.deviceName=iPhone 7 Simulator
saucelabs.target.platform=Mac
appium.platformName=iOS
appium.platformVersion=10.3

appium.app=<app zip file>
appium.appPackage=<package>
appium.appActivity=<activity>

